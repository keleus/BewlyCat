    bewly_widescreen_sidebar_priority_desc: 视频优先：侧栏默认收起为窄条，悬停临时展开，也可用按钮切换为完整侧栏（会压缩视频区域）；侧栏优先：侧栏默认完整显示并压缩视频区域。
